[tool.coverage.run]
branch = true
source = [ "analysis_translation_models" ]

[tool.coverage.report]
exclude_lines = ['if TYPE_CHECKING:']
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-report html:'../../coverage/projects/analysis-translation-models/html'
 --cov-report xml:'../../coverage/projects/analysis-translation-models/coverage.xml'
 --html='../../reports/projects/analysis-translation-models/unittests/html/index.html'
 --junitxml='../../reports/projects/analysis-translation-models/unittests/junit.xml'
"""

[project]
name = "analysis-translation-models"
version = "1.0.0"
description = "Automatically generated by Nx."
requires-python = ">=3.11,<4"
readme = 'README.md'
dependencies = [
    "transformers>=4.30.0",
    "sentence-transformers>=2.3.0",
    "umap-learn>=0.5.4",
    "scikit-learn>=1.3.0",
    "hdbscan>=0.8.32",
    "spacy>=3.6.0",
    "networkx>=3.1",
    "matplotlib>=3.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["analysis_translation_models"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
  "autopep8>=2.3.1",
  "ruff>=0.8.2",
  "pytest>=8.3.4",
  "pytest-sugar>=1.0.0",
  "pytest-cov>=6.0.0",
  "pytest-html>=4.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
exclude = [
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "dist",
]

line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
  # pycodestyle
  "E",
  # Pyflakes
  "F",
  # pyupgrade
  "UP",
  # flake8-bugbear
  "B",
  # flake8-simplify
  "SIM",
  # isort
  "I",
]
ignore = []

fixable = ["ALL"]
unfixable = []
