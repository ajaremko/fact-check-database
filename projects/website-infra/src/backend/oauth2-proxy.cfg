http_address = "0.0.0.0:4180"
upstreams = ["http://127.0.0.1:3000"]

# Dummy OAuth provider — required for oauth2-proxy to start, but never
# actually used since we only use the htpasswd login form below.
provider = "google"
client_id = "dummy-client-id"
redirect_url = "http://localhost:4180/oauth2/callback"

# htpasswd-based login (this is the auth you actually want).
htpasswd_file = "/etc/secret/htpasswd"
# htpasswd_user_group = "users"
display_htpasswd_form = true

# Required: satisfies the "email validation" check. "*" allows any user
# who successfully authenticates via htpasswd, since there's no real
# OAuth identity to check a domain against.
email_domains = ["*"]

# A real secret is required here — generate one, don't leave this as a placeholder.
cookie_secure = true

# Do NOT set skip_provider_button = true — that auto-redirects straight to
# the (dummy) OAuth provider instead of showing the htpasswd form.