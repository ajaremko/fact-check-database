# Ingestion source list: the feeds the ingestor fetches on every run.
#
# Each source needs id, name, collection (rss or atom) and url. A source may
# also set:
#   timeoutSeconds  overrides defaults.timeoutSeconds for this source
#   enabled         false keeps the source listed without fetching it
#   notes           free text for maintainers
#
# Ids must be unique, and an id must never change: it names the source's
# archive path and is part of every fact_check_id. The format is described in
#   projects/ingestion-ingestor/docs/runbook.md

defaults:
  # Seconds a fetch may take before it is abandoned and recorded as failed
  timeoutSeconds: 30

sources:
  - id: politifact
    name: politifact.com
    collection: rss
    url: https://www.politifact.com/rss/factchecks/

  - id: snopes
    name: snopes.com
    collection: rss
    url: https://www.snopes.com/feed/

  - id: afpfactcheck
    name: factcheck.afp.com
    collection: rss
    url: https://factcheck.afp.com/rss.xml
    notes: Returns 403 to the crawler's User-Agent. Kept so it starts working if access is granted.

