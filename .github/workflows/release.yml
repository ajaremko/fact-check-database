name: Production Release

on:
  push:
    branches:
      - prod

permissions:
  contents: write
  id-token: write

jobs:
  main:
    name: Release Production Images
    runs-on: ubuntu-latest
    steps:
      - name: Generate build number
        id: buildnumber
        uses: onyxmueller/build-tag-number@v1
        with:
          token: ${{secrets.github_token}}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Setup Node, cache dependencies
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Read stack outputs
        id: bootstrap
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: |
          cd projects/core-infra

          # Pull outputs as JSON, then extract the values we need
          OUT="$(pulumi stack output --json --stack=prod)"

          echo "gcp_project_id=$(echo "$OUT" | jq -r '.gcpProject')" >> "$GITHUB_OUTPUT"
          echo "wif_provider=$(echo "$OUT" | jq -r '.githubActionIdentityPoolProviderName')" >> "$GITHUB_OUTPUT"
          echo "service_account_email=$(echo "$OUT" | jq -r '.githubActionServiceAccountEmail')" >> "$GITHUB_OUTPUT"
          echo "artifact_registry_uri=$(echo "$OUT" | jq -r '.artifactRegistryUri')" >> "$GITHUB_OUTPUT"
          echo "artifact_registry_base_uri=$(echo "$OUT" | jq -r '.artifactRegistryBaseUri')" >> "$GITHUB_OUTPUT"

      - id: auth
        name: Setup GCP Credentials
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ steps.bootstrap.outputs.gcp_project_id }}
          workload_identity_provider: ${{ steps.bootstrap.outputs.wif_provider }}
          service_account: ${{ steps.bootstrap.outputs.service_account_email }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: '>= 416.0.0'
          project_id: ${{ steps.bootstrap.outputs.gcp_project_id }}
          credentials_file_path: ${{ steps.auth.outputs.credentials_file_path }}

      - name: Build and release Docker images
        env:
          BUILD_NUMBER: ${{ steps.buildnumber.outputs.build_number }}
          DOCKER_REGISTRY: ${{ steps.bootstrap.outputs.artifact_registry_uri }}
        run: |
          # Configure docker auth for Artifact Registry
          gcloud auth configure-docker ${{ steps.bootstrap.outputs.artifact_registry_base_uri }}

          # Configure git identity for nx release
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git fetch --tags # fetch existing tags

          # Build and publish production images
          npm ci
          npx nx release --dockerVersionScheme=production --yes
