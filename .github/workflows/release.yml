name: Production Release

# Runs on every merge to prod. It always runs the checks. It publishes
# production images only when the merge changed a containerized app, or when
# the workflow is started by hand. See docs/git-strategy.md.
on:
  push:
    branches:
      - prod
  workflow_dispatch:

# No job gets more than read access unless it asks for it below.
permissions:
  contents: read

# One run at a time, so two pushes can't race on build numbers and tags.
concurrency:
  group: release-prod
  cancel-in-progress: false

jobs:
  checks:
    name: Lint, Test, Typecheck and Build
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.apps.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Setup Node, cache dependencies
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      # Every project, not only those affected: a production release is
      # checked in full.
      - run: npx nx run-many -t lint test typecheck build

      # Compares with what prod held before this push. A promotion that only
      # carries documentation, infrastructure or an image tag affects no app,
      # and publishing for it would produce images identical to the last.
      - name: Find the containerized apps this push affects
        id: apps
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          apps=$(npx nx show projects --affected --with-target=docker:build --base="$BEFORE" --head="$GITHUB_SHA" --json)
          echo "Affected apps: $apps"
          if [ "$(echo "$apps" | jq length)" -gt 0 ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Release Production Images
    needs: checks
    if: needs.checks.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the build-number and release tags
      id-token: write # assumes the release identity
    steps:
      - name: Generate build number
        id: buildnumber
        uses: onyxmueller/build-tag-number@eab99bb956086490d1aa6b747dc265b5776e8eae # v1
        with:
          token: ${{ secrets.github_token }}

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Setup Node, cache dependencies
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # The project, identity and registry names are repository variables,
      # copied from core-infra's stack outputs. None of them is a secret.
      - id: auth
        name: Setup GCP Credentials
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          project_id: ${{ vars.PROD_GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.PROD_WIF_PROVIDER }}
          service_account: ${{ vars.PROD_RELEASE_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          version: '>= 416.0.0'
          project_id: ${{ vars.PROD_GCP_PROJECT_ID }}
          credentials_file_path: ${{ steps.auth.outputs.credentials_file_path }}

      - name: Build and release Docker images
        env:
          NEXT_PUBLIC_BUILD_NUMBER: ${{ steps.buildnumber.outputs.build_number }}
          BUILD_NUMBER: ${{ steps.buildnumber.outputs.build_number }}
          DOCKER_REGISTRY: ${{ vars.PROD_ARTIFACT_REGISTRY_URI }}
        run: |
          # Configure docker auth for Artifact Registry
          gcloud auth configure-docker ${{ vars.PROD_ARTIFACT_REGISTRY_BASE_URI }}

          # Configure git identity for nx release
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git fetch --tags # fetch existing tags

          # Build and publish production images
          npm ci
          npx nx release --dockerVersionScheme=production --yes
