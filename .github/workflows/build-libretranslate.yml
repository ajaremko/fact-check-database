name: Build LibreTranslate

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read
  id-token: write

run-name: Build LibreTranslate

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Setup Node, cache dependencies
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Read stack outputs
        id: bootstrap
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: |
          cd projects/core-infra

          # Pull outputs as JSON, then extract the values we need
          OUT="$(pulumi stack output --json --stack=${{ github.event.inputs.environment }})"

          echo "gcp_project_id=$(echo "$OUT" | jq -r '.gcpProject')" >> "$GITHUB_OUTPUT"
          echo "wif_provider=$(echo "$OUT" | jq -r '.githubActionIdentityPoolProviderName')" >> "$GITHUB_OUTPUT"
          echo "service_account_email=$(echo "$OUT" | jq -r '.githubActionServiceAccountEmail')" >> "$GITHUB_OUTPUT"
          echo "artifact_registry_uri=$(echo "$OUT" | jq -r '.artifactRegistryUri')" >> "$GITHUB_OUTPUT"
          echo "artifact_registry_base_uri=$(echo "$OUT" | jq -r '.artifactRegistryBaseUri')" >> "$GITHUB_OUTPUT"

      - id: auth
        name: Setup GCP Credentials
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ steps.bootstrap.outputs.gcp_project_id }}
          workload_identity_provider: ${{ steps.bootstrap.outputs.wif_provider }}
          service_account: ${{ steps.bootstrap.outputs.service_account_email }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: '>= 416.0.0'
          project_id: ${{ steps.bootstrap.outputs.gcp_project_id }}
          credentials_file_path: ${{ steps.auth.outputs.credentials_file_path }}

      - name: Checkout LibreTranslate
        uses: actions/checkout@v4
        with:
          repository: libretranslate/libretranslate
          path: libretranslate

      - name: Configure Docker Auth
        run: |
          # Configure docker auth for Artifact Registry
          gcloud auth configure-docker ${{ steps.bootstrap.outputs.artifact_registry_base_uri }}

      - name: Build and Push libretranslate
        uses: docker/build-push-action@v4
        with:
          file: libretranslate/docker/Dockerfile
          context: ./libretranslate
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            with_models=true
          tags: |
            ${{ steps.bootstrap.outputs.artifact_registry_uri }}/ingestion-libretranslate:${{ github.sha }}
            ${{ steps.bootstrap.outputs.artifact_registry_uri }}/ingestion-libretranslate:latest
