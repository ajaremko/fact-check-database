name: Pull Request Checks

# Runs the checks on every pull request. It holds no credentials: it cannot
# reach Google Cloud or push anything.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, Test, Typecheck and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Derive nx SHAs
        uses: nrwl/nx-set-shas@3e9ad7370203c1e93d109be57f3b72eb0eb511b1 # v4

      - name: Setup Node, cache dependencies
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - run: npx nx affected -t lint test typecheck build

  # prod moves only by promotion from main, or by a hotfix branch cut from
  # prod. See docs/git-strategy.md.
  promotion-source:
    name: Pull Request Into prod Comes From main or hotfix
    if: github.base_ref == 'prod'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check the source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::A pull request into prod must come from a branch of this repository."
            exit 1
          fi
          case "$HEAD_REF" in
            main | hotfix/*) echo "Source branch '$HEAD_REF' may be merged into prod." ;;
            *)
              echo "::error::A pull request into prod must come from main or a hotfix/* branch, not '$HEAD_REF'."
              exit 1
              ;;
          esac
